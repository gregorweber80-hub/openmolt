[project]
name = "openmolt"
version = "0.1.0"
description = "Personal OpenClaw-like assistant with Ollama, dashboard, gateway and extensible skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-telegram-bot>=21.4",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "google-api-python-client>=2.140.0",
  "google-auth-oauthlib>=1.2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "pytest-asyncio>=0.23.8"]

[project.scripts]
openmolt-terminal = "openmolt.interfaces.terminal_chat:app"
openmolt-telegram = "openmolt.interfaces.telegram_bot:run_bot"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openmolt"]
